services:
  api:
    build: .
    container_name: bomts_api
    ports:
      - "8000:8000"
    volumes:
      - ./app:/code/app
      - ./scripts:/code/scripts
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env}
      QDRANT_URL: ${QDRANT_URL:?set QDRANT_URL in .env}
      QDRANT_API_KEY: ${QDRANT_API_KEY:?set QDRANT_API_KEY in .env}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      EMBEDDING_MODE: ${EMBEDDING_MODE:-mock}
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      OPENCLAW_ENABLED: ${OPENCLAW_ENABLED:-false}
      OPENCLAW_BASE_URL: ${OPENCLAW_BASE_URL:-}
      OPENCLAW_DEFAULT_MODEL: ${OPENCLAW_DEFAULT_MODEL:-qwen3:8b}
      OPENCLAW_TIMEOUT_SECONDS: ${OPENCLAW_TIMEOUT_SECONDS:-5}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      GOOGLE_PROVIDER_ENABLED: ${GOOGLE_PROVIDER_ENABLED:-false}
      GOOGLE_TRANSLATION_ENABLED: ${GOOGLE_TRANSLATION_ENABLED:-false}
      GOOGLE_DEFAULT_MODEL: ${GOOGLE_DEFAULT_MODEL:-gemini-2.0-flash}
    depends_on:
      db:
        condition: service_healthy
      qdrant:
        condition: service_started
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  db:
    image: postgres:15-alpine
    container_name: bomts_db
    environment:
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:?set POSTGRES_ADMIN_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?set POSTGRES_ADMIN_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_ADMIN_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    container_name: bomts_qdrant
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:?set QDRANT_API_KEY in .env}
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  web:
    image: nginx:alpine
    container_name: bomts_web
    ports:
      - "8771:80"
    volumes:
      - ./web:/usr/share/nginx/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api

volumes:
  postgres_data:
  qdrant_data:
